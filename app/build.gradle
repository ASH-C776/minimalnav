plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.minimalnav'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.minimalnav'
        minSdk 23
        targetSdk 36
        // 版本号规则：versionName 三段数字，versionCode = major*10000 + minor*100 + patch。
        // 客户端 UpdateInfo.parseVersionCode 用的是同一个公式，两边必须一字不差，否则会误判降级。
        versionCode 10001
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // appcompat 1.7.1 自带 core 1.13+：WindowInsetsControllerCompat / enableEdgeToEdge 所需
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // 零地图 SDK：导航用高德 URI Intent，POI ID 模式用系统浏览器打开高德 Web URI。
    // 无需任何 Key，无需网络/定位权限。
}

// 统一 Kotlin stdlib：recyclerview 1.3.2 传递依赖老的 jdk7/jdk8 模块（1.6.21），
// 与 appcompat 1.7.1 带的完整 stdlib（1.8.22）重复。强制对齐避免 duplicate class。
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
        }
    }
}
